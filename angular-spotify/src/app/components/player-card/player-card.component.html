<div class="container card p-10">
  <div
    class="image"
    [style.background-image]="'url(' + music.album.imageUrl + ')'"
  ></div>

  <div class="controls">
    <span>{{ music.title }}</span>
    <div class="buttons">
      <fa-icon [icon]="previousIcon" (click)="previousSong()"></fa-icon>
      <fa-icon [icon]="playIcon" (click)="pauseSong()"></fa-icon>
      <fa-icon [icon]="nextIcon" (click)="nextSong()"></fa-icon>
    </div>
  </div>
</div>
